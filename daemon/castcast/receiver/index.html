<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CastCast Custom Receiver</title>
    <!-- Load the official Cast Receiver Framework -->
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
    <!-- The Cast video element -->
    <cast-media-player></cast-media-player>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        const playbackConfig = new cast.framework.PlaybackConfig();

        // 1. Activate the Native Debug Overlay!
        // This makes the Chromecast render a diagnostic UI on the TV screen.
        context.setLoggerLevel(cast.framework.LoggerLevel.DEBUG);

        // 2. The Widevine DRM Interceptor
        // Whenever the Chromecast encounters encrypted media, it hits this hook BEFORE
        // requesting the decryption keys from the license server.
        playbackConfig.licenseRequestHandler = requestInfo => {
            console.log("Intercepting Widevine License Request for:", requestInfo.url);
            
            // In the future, this is where we inject Amazon's 30-day offline auth tokens!
            // We can read them out of the media's customData payload:
            // const customData = playerManager.getMediaInformation()?.customData;
            // if (customData && customData.authHeaders) {
            //     requestInfo.headers = { ...requestInfo.headers, ...customData.authHeaders };
            // }

            // Ensure cookies/credentials are sent if the license server requires them
            requestInfo.withCredentials = true;
        };

        // Start the receiver context with our custom DRM config
        context.start({playbackConfig: playbackConfig});
    </script>
</body>
</html>
